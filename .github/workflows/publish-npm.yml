## 发布到 npm
##
## 为什么单独一个工作流：GitHub 安装需要 git ls-remote 预检，部分网络环境下会失败
## （issue #21 / #29）；npm 包安装走 registry，不需要 git，也能让 dsh 的
## Discover / plugin_market 索引识别到「有 npm 版本」的插件。
##
## 前置：在仓库 Settings → Secrets and variables → Actions 添加 NPM_TOKEN。
## Token 需要 npmjs.com 的 publish 权限；建议用 granular token，只授权本包。
## 没配置 token 时，发布步骤会跳过（不会让 Release 流程变红）。
name: publish-npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 自带的 npm 可能还不理解 2026 年的 staged publishing / 新包占位流程；
      # 固定升到最新 npm，避免把 2.5.x 发成 0.0.0-stage 占位。
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Test
        run: node --test test/*test.mjs

      # 注意：不能直接用 `env.NODE_AUTH_TOKEN != ''` 判断——
      # secret 未配置时 env 键不存在，表达式按 null 处理，null != '' 为真，
      # 结果会拿空 token 去 publish（实测 404）。这里用脚本显式判断。
      - name: Check npm token
        id: npm_token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish if NPM_TOKEN is configured
        if: steps.npm_token.outputs.configured == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip notice
        if: steps.npm_token.outputs.configured != 'true'
        run: echo "NPM_TOKEN 未配置，跳过 npm 发布；添加 secret 后可手动重跑本工作流。"
